<html><head><script src='https://cdn.jsdelivr.net/npm/p5@1.4.0/dist/p5.js'></script></head><body><script>let sourceLight, lens, screen; function setup() { createCanvas(800, 600); sourceLight = new SourceLight(); lens = new Lens(); screen = new Screen(); } function draw() { background(220); sourceLight.display(); lens.display(); screen.display(); } class SourceLight { constructor() { this.x = 100; this.y = 100; } display() { fill(255, 0, 0); ellipse(this.x, this.y, 20, 20); } } class Lens { constructor() { this.x = 300; this.y = 300; } display() { fill(0, 0, 255); rect(this.x, this.y, 50, 50); } } class Screen { constructor() { this.x = 500; this.y = 300; } display() { fill(0, 255, 0); rect(this.x, this.y, 50, 50); } }</script></body></html>
