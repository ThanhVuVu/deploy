<!DOCTYPE html>
<html lang='vi'>
<head>
    <meta charset='UTF-8'>
    <title>Mô phỏng Sự Nảy Mầm của Hạt</title>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js'></script>
    <style>
        body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f0f0; font-family: sans-serif; }
        canvas { border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        #ui-panel { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 10px; border: 2px solid #4CAF50; width: 250px; }
        .control-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        .status-box { margin-top: 10px; padding: 10px; background: #e8f5e9; border-radius: 5px; font-size: 0.9em; }
    </style>
</head>
<body>
    <div id='ui-panel'>
        <h3 style='margin-top:0; color: #2e7d32;'>Điều kiện Nảy mầm</h3>
        <div class='control-group'>
            <label>💧 Nước (Water):</label>
            <input type='checkbox' id='waterCheck' onchange='updateParams()'> Có nước
        </div>
        <div class='control-group'>
            <label>🌬️ Không khí (Oxygen):</label>
            <input type='checkbox' id='oxygenCheck' onchange='updateParams()'> Có không khí
        </div>
        <div class='control-group'>
            <label>🌡️ Nhiệt độ: <span id='tempVal'>25</span>°C</label>
            <input type='range' id='tempSlider' min='0' max='50' value='25' style='width:100%' oninput='updateParams()'>
        </div>
        <button onclick='resetSim()' style='width:100%; padding: 8px; cursor:pointer; background:#4CAF50; color:white; border:none; border-radius:4px;'>Đặt lại thí nghiệm</button>
        <div class='status-box' id='statusText'>Trạng thái: Hạt đang ngủ</div>
    </div>
    <script>
        let growth = 0;
        let hasWater = false;
        let hasOxygen = false;
        let temperature = 25;
        let plantStage = 0; // 0: seed, 1: swelling, 2: root, 3: shoot, 4: leaves
        
        function setup() {
            createCanvas(600, 500);
            textAlign(CENTER);
        }
        
        function updateParams() {
            hasWater = document.getElementById('waterCheck').checked;
            hasOxygen = document.getElementById('oxygenCheck').checked;
            temperature = parseInt(document.getElementById('tempSlider').value);
            document.getElementById('tempVal').innerText = temperature;
        }
        
        function resetSim() {
            growth = 0;
            plantStage = 0;
            document.getElementById('waterCheck').checked = false;
            document.getElementById('oxygenCheck').checked = false;
            document.getElementById('tempSlider').value = 25;
            updateParams();
        }
        
        function draw() {
            background(220, 240, 255);
            
            // Draw Soil
            fill(101, 67, 33);
            noStroke();
            rect(100, 300, 400, 150, 10);
            
            // Draw Pot
            stroke(150);
            strokeWeight(4);
            fill(200, 150, 100);
            rect(90, 300, 420, 160, 10);
            
            // Logic for growth
            // [Standard Simulation Values]: Temp range 15-35C for optimal growth
            if (hasWater && hasOxygen && temperature >= 15 && temperature <= 35) {
                growth += 0.1;
                document.getElementById('statusText').innerText = "Trạng thái: Đang nảy mầm... ✅";
                document.getElementById('statusText').style.color = "green";
            } else {
                document.getElementById('statusText').innerText = "Trạng thái: Không đủ điều kiện ❌";
                document.getElementById('statusText').style.color = "red";
            }
            
            // Determine Stage
            if (growth < 50) plantStage = 0;
            else if (growth < 150) plantStage = 1;
            else if (growth < 300) plantStage = 2;
            else if (growth < 500) plantStage = 3;
            else plantStage = 4;

            drawPlant();
            
            // HUD
            fill(0);
            textSize(16);
            text("Mô phỏng Sinh học: Sự nảy mầm của hạt", width/2, 40);
            
            // Progress Bar
            fill(200);
            rect(200, 450, 200, 20);
            fill(76, 175, 80);
            let barWidth = map(growth, 0, 500, 0, 200);
            rect(200, 450, min(barWidth, 200), 20);
            fill(0);
            text("Tiến độ phát triển", width/2, 440);
        }
        
        function drawPlant() {
            push();
            translate(width/2, 330);
            
            if (plantStage === 0) {
                // Seed
                fill(160, 120, 60);
                ellipse(0, 0, 20, 15);
            } else if (plantStage === 1) {
                // Swelling seed
                fill(180, 140, 80);
                ellipse(0, 0, 25, 20);
            } else if (plantStage === 2) {
                // Root emerging
                fill(160, 120, 60);
                ellipse(0, 0, 25, 20);
                stroke(255, 255, 255);
                strokeWeight(3);
                noFill();
                bezier(0, 10, 0, 20, 5, 30, 10, 40);
            } else if (plantStage === 3) {
                // Shoot emerging
                fill(160, 120, 60);
                ellipse(0, 0, 25, 20);
                stroke(255, 255, 255);
                strokeWeight(3);
                bezier(0, 10, 0, 20, 5, 30, 10, 40);
                stroke(100, 200, 100);
                strokeWeight(4);
                line(0, 0, 0, -30);
            } else if (plantStage === 4) {
                // Full seedling
                fill(160, 120, 60);
                ellipse(0, 0, 25, 20);
                stroke(255, 255, 255);
                strokeWeight(3);
                bezier(0, 10, 0, 20, 5, 30, 10, 40);
                stroke(34, 139, 34);
                strokeWeight(5);
                line(0, 0, 0, -80);
                fill(50, 205, 50);
                noStroke();
                ellipse(-15, -80, 30, 15);
                ellipse(15, -80, 30, 15);
            }
            pop();
        }
    </script>
</body>
</html>
