<!DOCTYPE html><html lang='vi'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Mô phỏng sự chuyển thể của chất</title><script src='https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js'></script><style>body{margin:0;background:#eef3f8;font-family:Arial,Helvetica,sans-serif;color:#102030}canvas{display:block}button,input{font-family:Arial,Helvetica,sans-serif}</style></head><body><script>let tempSlider,speedSlider,heatBtn,coolBtn,pauseBtn,resetBtn;let currentTemp=-250;let mode='pause';let selectedIndex=0;let cardRects=[];const SIM={minT:-250,maxT:3000,near:5,particlesPerSubstance:24,defaultSpeed:4};/* [Standard Simulation Values] dải nhiệt -250..3000 °C, ngưỡng gần chuyển thể ±5 °C, 24 hạt/chất, tốc độ quét tự động là giá trị trình diễn. */const SUBSTANCES=[{vn:'Oxygen',melt:-219,boil:-183,c:[86,170,255],srcM:'Table 5 p43',srcB:'Table 6 p43'},{vn:'Ethanol',melt:-114,boil:78,c:[255,181,80],srcM:'Table 5 p43',srcB:'Table 6 p43'},{vn:'Nước / nước đá',melt:0,boil:100,c:[70,140,255],srcM:'Table 5 p43',srcB:'Table 6 p43'},{vn:'Thủy ngân',melt:-39,boil:357,c:[150,160,170],srcM:'Table 5 p43',srcB:'Table 6 p43'},{vn:'Sắt',melt:1536,boil:2880,c:[190,85,55],srcM:'Table 5 p43',srcB:'Table 6 p43'}];const AUX_FACTS=[{src:'Text 3 p42',txt:'Sự nóng chảy là quá trình chuyển từ thể rắn sang thể lỏng của chất.'},{src:'Text 1 p39',txt:'Đo nhiệt độ sôi của nước: bình cầu chứa 150 mL nước cất có cắm nhiệt kế; đun bằng đèn cồn đến khi nước sôi; quan sát nhiệt kế, bề mặt, trong lòng chất lỏng và dấu ống dẫn khí thoát ra.'},{src:'Text 3 p42',txt:'Đun sôi và làm lạnh nước: lấy lượng nhỏ nước vào cốc thủy tinh chịu nhiệt, đun sôi trên đèn cồn, quan sát bề mặt thoáng; đặt bình cầu đáy tròn chứa nước lạnh trên miệng cốc và quan sát dưới đáy bình.'},{src:'Text 3 p42',txt:'Làm nóng chảy nến: cắt nhỏ mẫu nến màu đỏ vào bát sứ, đun trên ngọn lửa đèn cồn; khi nến chuyển sang thể lỏng thì tắt đèn cồn và để nguội.'},{src:'Text 1 p39',txt:'Hòa tan/trộn: dùng 2 cốc thủy tinh giống nhau có cùng lượng nước; cốc 1 cho một thìa muối ăn, cốc 2 cho một thìa dầu ăn, khuấy đều và quan sát.'},{src:'Text 2 p57',txt:'An toàn khi đốt nóng vật liệu bằng đèn cồn: dùng kẹp sắt với đinh sắt, dây đồng, mẩu gỗ, mẩu nhôm, miếng nhựa, mẩu sành; khi kẹp sắt nóng thì ngừng đốt và cho vật liệu vào chậu nước để tránh bỏng.'},{src:'Text 4 p105',txt:'Butane: dụng cụ ống nghiệm, kẹp ống nghiệm, giá thí nghiệm, ống hút nhỏ giọt; hóa chất butane trong bật lửa gas và nước vôi trong; thêm khoảng 5 mL nước vôi trong, lắc nhẹ.'},{src:'Text 4 p105',txt:'Cháy butane tỏa nhiều nhiệt, tạo CO2 và H2O: 2C4H10 + 13O2 -> 8CO2 + 10H2O; thành ống nghiệm có hơi nước đọng.'}];const SOURCE_TRACE=['TABLE p43 c1593587: nhiệt độ nóng chảy','TABLE p43 d984ef86: nhiệt độ sôi','TEXT p42 76a123f: định nghĩa nóng chảy, nến, nước','TEXT p39 7eda457: 150 mL nước cất, sôi nước, muối/dầu','TEXT p57 ca2fb85: an toàn đèn cồn và kẹp sắt','TEXT p105 079b545: butane, 5 mL nước vôi trong, phương trình'];let particles=[];function setup(){createCanvas(1280,920);textFont('Arial');tempSlider=createSlider(SIM.minT,SIM.maxT,SIM.minT,1);tempSlider.position(355,58);tempSlider.style('width','520px');tempSlider.input(()=>{currentTemp=tempSlider.value();mode='pause';});speedSlider=createSlider(1,25,SIM.defaultSpeed,1);speedSlider.position(930,58);speedSlider.style('width','150px');heatBtn=createButton('Tự tăng nhiệt');heatBtn.position(355,90);heatBtn.mousePressed(()=>mode='heat');coolBtn=createButton('Tự giảm nhiệt');coolBtn.position(455,90);coolBtn.mousePressed(()=>mode='cool');pauseBtn=createButton('Tạm dừng');pauseBtn.position(560,90);pauseBtn.mousePressed(()=>mode='pause');resetBtn=createButton('Đặt lại -250 °C');resetBtn.position(640,90);resetBtn.mousePressed(()=>{currentTemp=SIM.minT;tempSlider.value(currentTemp);mode='pause';});initParticles();}function initParticles(){particles=[];for(let s=0;s<SUBSTANCES.length;s++){let arr=[];for(let i=0;i<SIM.particlesPerSubstance;i++){arr.push({sx:(i%6)/5,sy:floor(i/6)/3,x:0.18+((i*37)%64)/100,y:0.2+((i*53)%65)/100,vx:0.002+((i%5)*0.0009),vy:0.002+(((i+2)%5)*0.0008)});}particles.push(arr);}}function draw(){background(235,242,248);updateTemperature();drawHeader();drawThermometer();drawSubstanceCards();drawDataTable();drawFactPanel();drawSourceTrace();}function updateTemperature(){if(mode==='heat'){currentTemp+=speedSlider.value();}else if(mode==='cool'){currentTemp-=speedSlider.value();}currentTemp=constrain(currentTemp,SIM.minT,SIM.maxT);tempSlider.value(round(currentTemp));}function phaseOf(s,t){if(t<s.melt)return 'rắn';if(t<s.boil)return 'lỏng';return 'khí';}function transitionOf(s,t){if(abs(t-s.melt)<=SIM.near)return 'đang nóng chảy: rắn → lỏng';if(abs(t-s.boil)<=SIM.near)return 'đang sôi: lỏng → khí';return '';}function drawHeader(){fill(18,45,75);textStyle(BOLD);textSize(26);textAlign(LEFT,TOP);text('Mô phỏng sự chuyển thể của các chất',24,16);textStyle(NORMAL);textSize(14);text('Kéo thanh nhiệt độ hoặc dùng nút tự động. Trạng thái được tính trực tiếp từ nhiệt độ nóng chảy và nhiệt độ sôi trong bảng nguồn.',24,47);fill(0);textSize(14);text('Nhiệt độ hiện tại:',210,60);textStyle(BOLD);textSize(24);fill(180,25,25);text(nf(currentTemp,1,0)+' °C',210,78);textStyle(NORMAL);fill(0);textSize(12);text('Tốc độ quét [Standard Simulation Values]',905,38);text(speedSlider.value()+' °C/khung hình',1090,62);}function drawThermometer(){let x=34,y=130,h=520,w=26;stroke(60);strokeWeight(2);fill(255);rect(x,y,w,h,12);fill(255,80,60);let yy=map(currentTemp,SIM.minT,SIM.maxT,y+h,y);rect(x+5,yy,w-10,y+h-yy,8);circle(x+w/2,y+h+22,48);fill(255,80,60);circle(x+w/2,y+h+22,36);fill(20);noStroke();textSize(12);textAlign(LEFT,CENTER);text('Nhiệt kế °C',18,y-18);let ticks=[SIM.minT,-219,-183,-114,-39,0,78,100,357,1536,2880,SIM.maxT];for(let i=0;i<ticks.length;i++){let t=ticks[i];let ty=map(t,SIM.minT,SIM.maxT,y+h,y);stroke(50);line(x+w+2,ty,x+w+12,ty);noStroke();fill(30);textSize(10);text(t+'°',x+w+16,ty);}fill(90);textSize(10);textAlign(LEFT,TOP);text('Vạch đánh dấu gồm tất cả điểm nóng chảy/sôi từ Table 5-6 p43.',18,y+h+55,90,80);}function drawSubstanceCards(){cardRects=[];let startX=115,gap=12,cw=220,ch=255,cy=130;for(let i=0;i<SUBSTANCES.length;i++){let x=startX+i*(cw+gap);cardRects.push({x:x,y:cy,w:cw,h:ch});drawCard(i,x,cy,cw,ch);}}function drawCard(i,x,y,w,h){let s=SUBSTANCES[i];let ph=phaseOf(s,currentTemp);let tr=transitionOf(s,currentTemp);let col=color(s.c[0],s.c[1],s.c[2]);stroke(i===selectedIndex?color(255,135,0):color(120));strokeWeight(i===selectedIndex?4:1);fill(255);rect(x,y,w,h,14);noStroke();fill(20);textAlign(CENTER,TOP);textStyle(BOLD);textSize(17);text(s.vn,x+w/2,y+10);textStyle(NORMAL);textSize(12);text('Nóng chảy: '+s.melt+' °C  |  Sôi: '+s.boil+' °C',x+w/2,y+36);let bx=x+22,by=y+66,bw=w-44,bh=125;stroke(80);strokeWeight(1);fill(245);rect(bx,by,bw,bh,8);if(ph==='lỏng'){noStroke();fill(red(col),green(col),blue(col),115);rect(bx+4,by+bh*0.52,bw-8,bh*0.44,0,0,8,8);stroke(red(col),green(col),blue(col));noFill();beginShape();for(let k=0;k<=20;k++){let wx=bx+5+k*(bw-10)/20;let wy=by+bh*0.52+sin(frameCount*0.07+k)*4;vertex(wx,wy);}endShape();}if(ph==='khí'){stroke(red(col),green(col),blue(col),120);for(let a=0;a<4;a++){let ax=bx+30+a*35;line(ax,by+bh-16,ax,by+26);line(ax,by+26,ax-5,by+36);line(ax,by+26,ax+5,by+36);}}drawParticlesFor(i,bx,by,bw,bh,ph,col);fill(15);noStroke();textAlign(CENTER,TOP);textStyle(BOLD);textSize(19);text('Thể: '+ph.toUpperCase(),x+w/2,y+198);textStyle(NORMAL);textSize(12);fill(70);text('Nguồn: '+s.srcM+'; '+s.srcB,x+w/2,y+224);if(tr!==''){let blink=160+80*sin(frameCount*0.18);fill(255,245,120,blink);rect(x+10,y+169,w-20,24,6);fill(160,50,0);textStyle(BOLD);text(tr,x+w/2,y+174);textStyle(NORMAL);}}function drawParticlesFor(idx,bx,by,bw,bh,ph,col){let arr=particles[idx];noStroke();for(let j=0;j<arr.length;j++){let p=arr[j];let px,py;if(ph==='rắn'){let cols=6;let rows=4;let gx=j%cols;let gy=floor(j/cols);px=bx+bw*0.22+gx*bw*0.11+sin(frameCount*0.12+j)*1.2;py=by+bh*0.62+gy*bh*0.07+cos(frameCount*0.11+j)*1.2;}else{let minY=ph==='lỏng'?0.56:0.12;let maxY=ph==='lỏng'?0.9:0.88;p.x+=p.vx*(ph==='khí'?2.2:1);p.y+=p.vy*(ph==='khí'?-1.8:1);if(p.x>0.9||p.x<0.1)p.vx*=-1;if(p.y>maxY||p.y<minY)p.vy*=-1;px=bx+p.x*bw;py=by+p.y*bh;}fill(red(col),green(col),blue(col),ph==='khí'?150:220);circle(px,py,10);if(ph==='lỏng'&&abs(currentTemp-SUBSTANCES[idx].boil)<40){fill(255,255,255,150);circle(px,py-8,4);}}}function drawDataTable(){let x=115,y=415,w=1105,h=190;fill(255);stroke(130);rect(x,y,w,h,10);fill(20,55,90);noStroke();textAlign(LEFT,TOP);textStyle(BOLD);textSize(18);text('Bảng xác định nhiệt độ nóng chảy, nhiệt độ sôi và trạng thái tại T hiện tại',x+16,y+12);let cols=[0,230,430,625,850];let headers=['Chất','Nhiệt độ nóng chảy (°C)','Nhiệt độ sôi (°C)','Trạng thái tại T','Dấu hiệu'];textSize(12);fill(40);for(let c=0;c<headers.length;c++)text(headers[c],x+16+cols[c],y+48);stroke(210);line(x+12,y+68,x+w-12,y+68);textStyle(NORMAL);for(let i=0;i<SUBSTANCES.length;i++){let s=SUBSTANCES[i];let rowY=y+76+i*21;let ph=phaseOf(s,currentTemp);let tr=transitionOf(s,currentTemp);noStroke();fill(i===selectedIndex?color(255,246,214):color(255));rect(x+8,rowY-2,w-16,20);fill(20);text(s.vn,x+16+cols[0],rowY);text(s.melt,x+16+cols[1],rowY);text(s.boil,x+16+cols[2],rowY);text(ph,x+16+cols[3],rowY);fill(tr===''?80:color(190,60,0));text(tr===''?'ổn định trong vùng '+ph:tr,x+16+cols[4],rowY);}fill(90);textSize(11);text('[Standard Simulation Values] Dải nhiệt -250..3000 °C và ngưỡng nhấp nháy ±5 °C dùng để trình diễn trên máy tính.',x+16,y+h-24);}function drawFactPanel(){let x=115,y=625,w=1105,h=230;fill(252);stroke(150);rect(x,y,w,h,10);noStroke();fill(30,70,100);textStyle(BOLD);textSize(16);textAlign(LEFT,TOP);text('Ghi chú khoa học và an toàn từ các đoạn RAG liên quan',x+16,y+10);textStyle(NORMAL);textSize(10.5);let colW=350;let cx=x+16;let cy=y+38;for(let i=0;i<AUX_FACTS.length;i++){let f=AUX_FACTS[i];fill(25);textStyle(BOLD);text('['+f.src+']',cx,cy);textStyle(NORMAL);let lines=wrapLines(f.txt,52);for(let k=0;k<lines.length;k++){text(lines[k],cx,cy+13+k*12);}cy+=16+lines.length*12;if(cy>y+h-28){cy=y+38;cx+=colW;}}}function wrapLines(str,maxChars){let words=str.split(' ');let lines=[];let line='';for(let i=0;i<words.length;i++){let test=line===''?words[i]:line+' '+words[i];if(test.length>maxChars){lines.push(line);line=words[i];}else{line=test;}}if(line!=='')lines.push(line);return lines;}function drawSourceTrace(){let x=115,y=865,w=1105,h=42;fill(230,238,246);stroke(160);rect(x,y,w,h,8);fill(50);noStroke();textSize(10);textAlign(LEFT,TOP);textStyle(BOLD);text('Grounding map:',x+10,y+6);textStyle(NORMAL);text(SOURCE_TRACE.join('  |  '),x+100,y+6,w-115,h-8);}function mousePressed(){for(let i=0;i<cardRects.length;i++){let r=cardRects[i];if(mouseX>=r.x&&mouseX<=r.x+r.w&&mouseY>=r.y&&mouseY<=r.y+r.h){selectedIndex=i;}}}</script></body></html>
