<!DOCTYPE html>
<html lang='vi'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Thí nghiệm khúc xạ ánh sáng</title>
<script src='https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js'></script>
<style>
body{margin:0;background:#eef3f8;font-family:Arial,Helvetica,sans-serif;color:#123} canvas{display:block;margin:0 auto;border:1px solid #9aa;background:white} .p5ui{font-size:14px}
</style>
</head>
<body>
<script>
// Mô phỏng khúc xạ ánh sáng dựa trên RAG. Các giá trị chiết suất và c là [Standard Simulation Values].
let angleSlider, mediumSelect, directionSelect, autoButton, resetButton;
let autoSweep=false, sweepDir=1;
const STD='[Standard Simulation Values]';
const C_AIR=3.00e8; // [Standard Simulation Values] tốc độ ánh sáng không khí/chân không dùng để minh hoạ n=c/v
const SOURCE_TRACE=[
 {id:'T1',text:'science_db_9.pdf p20: khúc xạ; chiết suất; n=sin i/sin r; phản xạ toàn phần'},
 {id:'T4',text:'science_db_9.pdf p20: đũa trong nước như bị gãy; dụng cụ laser + bàn bán trụ thủy tinh'},
 {id:'I5',text:'science_db_9.pdf p22 image: laser qua bàn bán trụ trên thước đo góc'},
 {id:'T2/I6',text:'science_db_9.pdf p25,p6: lăng kính, quang phổ, màu sắc ánh sáng'},
 {id:'T3',text:'science_db_7.pdf p73: điện kế khi bật/chưa bật đèn'}
];
const MEDIA={
 'Thủy tinh':{n:1.50,color:[120,190,255,80],src:'I5,T4,'+STD},
 'Nước':{n:1.33,color:[80,180,255,70],src:'T4,'+STD},
 'Không khí':{n:1.00,color:[235,245,255,40],src:'T1,'+STD}
};
function setup(){
 createCanvas(1100,720);
 textFont('Arial');
 angleSlider=createSlider(0,80,35,1); angleSlider.position(25,48); angleSlider.style('width','210px'); angleSlider.class('p5ui');
 mediumSelect=createSelect(); mediumSelect.position(265,48); mediumSelect.option('Thủy tinh'); mediumSelect.option('Nước'); mediumSelect.option('Không khí'); mediumSelect.selected('Thủy tinh'); mediumSelect.class('p5ui');
 directionSelect=createSelect(); directionSelect.position(390,48); directionSelect.option('Không khí → môi trường dưới'); directionSelect.option('Môi trường dưới → không khí'); directionSelect.selected('Không khí → môi trường dưới'); directionSelect.class('p5ui');
 autoButton=createButton('Tự động quét góc'); autoButton.position(620,47); autoButton.mousePressed(()=>{autoSweep=!autoSweep;}); autoButton.class('p5ui');
 resetButton=createButton('Đặt lại'); resetButton.position(760,47); resetButton.mousePressed(()=>{angleSlider.value(35); autoSweep=false; mediumSelect.selected('Thủy tinh'); directionSelect.selected('Không khí → môi trường dưới');}); resetButton.class('p5ui');
}
function draw(){
 background(248,251,255);
 if(autoSweep){let a=angleSlider.value()+sweepDir*0.35; if(a>80){a=80;sweepDir=-1;} if(a<0){a=0;sweepDir=1;} angleSlider.value(a);}
 const mediumName=mediumSelect.value();
 const lower=MEDIA[mediumName];
 const fromAir=directionSelect.value().startsWith('Không khí');
 const n1=fromAir?1.00:lower.n;
 const n2=fromAir?lower.n:1.00;
 const iDeg=angleSlider.value();
 const model=computeOptics(iDeg,n1,n2);
 drawTitleAndControls(iDeg,mediumName,fromAir);
 drawExperiment(lower,fromAir,model,iDeg,n1,n2,mediumName);
 drawHud(model,iDeg,n1,n2,mediumName,fromAir);
 drawChopstickInset();
 drawPrismInset();
 drawSourceMap();
}
function computeOptics(iDeg,n1,n2){
 const iRad=radians(iDeg);
 const sinI=sin(iRad);
 const sinR=(n1/n2)*sinI;
 const tir=sinR>1.0000001;
 let rDeg=null, crit=null;
 if(!tir){rDeg=degrees(asin(constrain(sinR,-1,1)));}
 if(n1>n2){crit=degrees(asin(n2/n1));}
 return {sinI:sinI,sinR:sinR,tir:tir,rDeg:rDeg,crit:crit};
}
function drawTitleAndControls(iDeg,mediumName,fromAir){
 noStroke(); fill(15,45,75); textSize(22); textStyle(BOLD); text('Thí nghiệm ảo: Hiện tượng khúc xạ ánh sáng',25,28); textStyle(NORMAL);
 textSize(13); fill(35,55,75); text('Góc tới i: '+nf(iDeg,1,0)+'°',25,43); text('Môi trường dưới:',265,43); text('Chiều truyền:',390,43);
 fill(110,20,20); textSize(12); text('Kéo góc tới, đổi môi trường và quan sát tia bị lệch tại mặt phân cách.',845,54);
}
function drawExperiment(lower,fromAir,model,iDeg,n1,n2,mediumName){
 const hit={x:430,y:360}; const L=280;
 noStroke(); fill(245,250,255); rect(0,90,760,270); fill(lower.color[0],lower.color[1],lower.color[2],lower.color[3]); rect(0,360,760,270);
 stroke(40,95,145); strokeWeight(2); line(0,360,760,360); noStroke(); fill(35,80,120); textSize(15); text('Mặt phân cách hai môi trường trong suốt',250,353);
 fill(40,80,120); textSize(14); text('Không khí n≈1,00',20,125); text(mediumName+' n≈'+nf(lower.n,1,2),20,590);
 drawSemiBlock(hit,lower,mediumName);
 drawProtractor(hit);
 stroke(60,60,60); strokeWeight(1.4); drawingContext.setLineDash([6,5]); line(hit.x,120,hit.x,610); drawingContext.setLineDash([]); noStroke(); fill(60); textSize(13); text('Pháp tuyến',hit.x+8,130);
 const iRad=radians(iDeg);
 let sx,sy,ex,ey,rx,ry;
 if(fromAir){sx=hit.x-sin(iRad)*L; sy=hit.y-cos(iRad)*L;} else {sx=hit.x-sin(iRad)*L; sy=hit.y+cos(iRad)*L;}
 drawLaser(sx,sy,hit.x,hit.y,fromAir);
 stroke(255,30,20); strokeWeight(4); line(sx,sy,hit.x,hit.y);
 stroke(255,100,60); strokeWeight(1); line(sx,sy,hit.x,hit.y);
 drawingContext.setLineDash([5,7]); stroke(120,120,120); strokeWeight(1.5);
 if(fromAir){line(hit.x,hit.y,hit.x+sin(iRad)*220,hit.y+cos(iRad)*220);} else {line(hit.x,hit.y,hit.x+sin(iRad)*220,hit.y-cos(iRad)*220);} drawingContext.setLineDash([]);
 if(model.tir){
   stroke(255,145,0); strokeWeight(4); ex=hit.x+sin(iRad)*L; ey=fromAir?hit.y-cos(iRad)*L:hit.y+cos(iRad)*L; line(hit.x,hit.y,ex,ey);
   noStroke(); fill(185,70,0); textSize(16); textStyle(BOLD); text('Phản xạ toàn phần: không có tia khúc xạ ra môi trường 2',250,665); textStyle(NORMAL);
 } else {
   const rRad=radians(model.rDeg);
   if(fromAir){rx=hit.x+sin(rRad)*L; ry=hit.y+cos(rRad)*L;} else {rx=hit.x+sin(rRad)*L; ry=hit.y-cos(rRad)*L;}
   stroke(30,150,255); strokeWeight(4); line(hit.x,hit.y,rx,ry); stroke(160,220,255); strokeWeight(1); line(hit.x,hit.y,rx,ry);
 }
 drawAngleArc(hit,iDeg,model,fromAir);
}
function drawSemiBlock(hit,lower,mediumName){
 push(); translate(hit.x,hit.y); noStroke(); fill(lower.color[0],lower.color[1],lower.color[2],120); arc(0,0,290,290,0,PI,CHORD); stroke(20,110,170); strokeWeight(2); noFill(); arc(0,0,290,290,0,PI,CHORD); pop();
 noStroke(); fill(10,80,130); textSize(13); text('Bàn bán trụ '+mediumName.toLowerCase()+' trên bảng thước đo góc [I5,T4]',292,520);
}
function drawProtractor(hit){
 push(); translate(hit.x,hit.y); noFill(); stroke(125,125,125,150); strokeWeight(1);
 for(let r=55;r<=150;r+=24){arc(0,0,r*2,r*2,PI, TWO_PI); arc(0,0,r*2,r*2,0,PI);} 
 for(let a=0;a<=180;a+=10){let rad=radians(a); let x1=cos(rad)*145, y1=sin(rad)*145; let x2=cos(rad)*155, y2=sin(rad)*155; line(x1,y1,x2,y2); let lx=cos(rad)*170, ly=sin(rad)*170; noStroke(); fill(80); textSize(10); textAlign(CENTER,CENTER); text(abs(90-a),lx,ly); stroke(125,125,125,150);} pop(); textAlign(LEFT,BASELINE);
}
function drawLaser(sx,sy,hx,hy,fromAir){
 push(); translate(sx,sy); const ang=atan2(hy-sy,hx-sx); rotate(ang); fill(80); stroke(40); rect(-44,-13,48,26,5); fill(210,20,20); rect(-54,-9,14,18,3); fill(255,230,80); noStroke(); ellipse(2,0,8,8); pop(); noStroke(); fill(90); textSize(12); text('Đèn laser',sx-45,sy-22);
}
function drawAngleArc(hit,iDeg,model,fromAir){
 noFill(); strokeWeight(2); stroke(255,60,40); const s=fromAir?-HALF_PI:HALF_PI; const e=fromAir?-HALF_PI-radians(iDeg):HALF_PI+radians(iDeg); arc(hit.x,hit.y,90,90,min(s,e),max(s,e)); noStroke(); fill(200,25,20); textSize(15); text('i='+nf(iDeg,1,0)+'°',hit.x-83,fromAir?hit.y-58:hit.y+74);
 if(!model.tir){stroke(30,140,235); noFill(); let rs=fromAir?HALF_PI:-HALF_PI; let re=fromAir?HALF_PI-radians(model.rDeg):-HALF_PI+radians(model.rDeg); arc(hit.x,hit.y,125,125,min(rs,re),max(rs,re)); noStroke(); fill(20,105,190); text('r='+nf(model.rDeg,1,1)+'°',hit.x+50,fromAir?hit.y+82:hit.y-65);} 
}
function drawHud(model,iDeg,n1,n2,mediumName,fromAir){
 const x=780,y=90,w=300,h=360; noStroke(); fill(255); rect(x,y,w,h,12); stroke(175,190,210); noFill(); rect(x,y,w,h,12); noStroke(); fill(20,55,90); textSize(18); textStyle(BOLD); text('Bảng quan sát và công thức',x+15,y+28); textStyle(NORMAL); textSize(13); fill(30,45,60);
 let yy=y+58; text('Hiện tượng: tia sáng đổi hướng khi qua mặt phân cách [T1].',x+15,yy,w-25); yy+=42; text('Chiết suất: n = c_không khí / v_môi trường [T1].',x+15,yy,w-25); yy+=38; text('Định luật trong trường hợp đơn giản: n = sin i / sin r [T1].',x+15,yy,w-25); yy+=42;
 fill(245,248,252); rect(x+15,yy-18,w-30,130,8); fill(20,45,70); text('n1 = '+nf(n1,1,2)+'   n2 = '+nf(n2,1,2),x+28,yy+4); yy+=24; text('sin i = '+nf(model.sinI,1,3),x+28,yy); yy+=22;
 if(model.tir){fill(185,60,0); text('sin r tính được = '+nf(model.sinR,1,3)+' > 1',x+28,yy); yy+=22; text('Kết luận: phản xạ toàn phần [T1,T4].',x+28,yy,w-55); yy+=34;} else {fill(20,90,150); text('sin r = '+nf(model.sinR,1,3),x+28,yy); yy+=22; text('r = '+nf(model.rDeg,1,2)+'°',x+28,yy); yy+=22; if(fromAir && model.rDeg!==0){text('sin i / sin r ≈ '+nf(model.sinI/sin(radians(model.rDeg)),1,2),x+28,yy);} else {text('Dạng tổng quát dùng trong mô phỏng: n1 sin i = n2 sin r '+STD,x+28,yy,w-55);} yy+=34;}
 if(model.crit){fill(140,65,0); text('Góc giới hạn mô phỏng: i_gh ≈ '+nf(model.crit,1,1)+'° '+STD,x+28,yy,w-55); yy+=34;}
 fill(30,45,60); const v2=C_AIR/n2; text('Tốc độ ánh sáng trong môi trường 2: v≈'+formatSci(v2)+' m/s '+STD,x+15,y+323,w-25); text('Dụng cụ: laser + bàn bán trụ + thước đo góc [I5,T4].',x+15,y+350,w-25);
}
function formatSci(v){return (v/1e8).toFixed(2)+'×10^8';}
function drawChopstickInset(){
 const x=25,y=625,w=330,h=78; noStroke(); fill(255); rect(x,y,w,h,10); stroke(180,200,220); noFill(); rect(x,y,w,h,10); noStroke(); fill(20,70,110); textSize(14); textStyle(BOLD); text('Quan sát đời sống [T4]',x+12,y+20); textStyle(NORMAL); textSize(12); text('Đũa nhúng trong nước trông như bị gãy tại mặt nước.',x+12,y+38);
 stroke(80,160,220); line(x+205,y+44,x+315,y+44); fill(100,180,240,60); noStroke(); rect(x+205,y+44,110,25); stroke(125,70,25); strokeWeight(6); line(x+215,y+26,x+252,y+44); stroke(125,70,25); line(x+263,y+46,x+305,y+66); strokeWeight(1);
}
function drawPrismInset(){
 const x=380,y=625,w=360,h=78; noStroke(); fill(255); rect(x,y,w,h,10); stroke(180,200,220); noFill(); rect(x,y,w,h,10); noStroke(); fill(20,70,110); textSize(14); textStyle(BOLD); text('Mở rộng ánh sáng qua lăng kính [T2,I6]',x+12,y+20); textStyle(NORMAL); textSize(12); text('Lăng kính làm đổi đường truyền; ánh sáng trắng có thể tạo quang phổ.',x+12,y+38);
 stroke(245); strokeWeight(4); line(x+190,y+52,x+245,y+52); noFill(); stroke(70,120,170); strokeWeight(2); triangle(x+245,y+25,x+245,y+68,x+295,y+48); const cols=['red','orange','yellow','green','cyan','blue','purple']; for(let k=0;k<cols.length;k++){stroke(cols[k]); line(x+295,y+48,x+340,y+30+k*7);} strokeWeight(1);
}
function drawSourceMap(){
 const x=780,y=470,w=300,h=225; noStroke(); fill(255); rect(x,y,w,h,12); stroke(175,190,210); noFill(); rect(x,y,w,h,12); noStroke(); fill(20,55,90); textSize(16); textStyle(BOLD); text('Bản đồ căn cứ RAG',x+15,y+24); textStyle(NORMAL); textSize(11.5); fill(35,45,60); let yy=y+45; for(const s of SOURCE_TRACE){text(s.id+': '+s.text,x+15,yy,w-25); yy+=39;} fill(105,40,40); text('Ghi chú: các hằng số có nhãn '+STD+' chỉ để tính/hiển thị trong mô phỏng.',x+15,y+h-20,w-25);
}
</script>
</body>
</html>
