<!DOCTYPE html>
<html lang='vi'>
<head>
    <meta charset='UTF-8'>
    <title>Mô phỏng Nảy mầm Hạt Đậu</title>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js'></script>
    <style>
        body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; background: #2c3e50; font-family: sans-serif; overflow: hidden; }
        canvas { border: 4px solid #34495e; border-radius: 8px; }
    </style>
</head>
<body>
<script>
/**
 * GROUNDING MAP:
 * - Temp 30-35C: [Text 1]
 * - Temp 35-40C (Soaking): [Text 4]
 * - Filter seeds: [Text 1]
 * - Moist cotton/soil: [Text 1, Text 5]
 * - Light for growth: [Text 4]
 */

let tempSlider, lightSlider, waterToggle, resetBtn, filterBtn;
let seed;
let growthProgress = 0;
let stage = 'DRY'; // DRY -> SOAKED -> ROOTING -> SPROUTING -> GROWING
let isFiltered = false;

const OPTIMAL_TEMP_MIN = 30;
const OPTIMAL_TEMP_MAX = 40;
const CRITICAL_LOW = 20;
const CRITICAL_HIGH = 45;

function setup() {
    createCanvas(900, 600);
    
    // Control Panel UI
    filterBtn = createButton('1. Lọc hạt lép/vỡ');
    filterBtn.position(20, 50);
    filterBtn.mousePressed(() => { isFiltered = true; });

    waterToggle = createCheckbox('2. Ngâm nước / Tưới nước', false);
    waterToggle.position(20, 90);

    createP('3. Nhiệt độ (°C)').position(20, 130).style('color', 'white');
    tempSlider = createSlider(0, 60, 25);
    tempSlider.position(20, 150);

    createP('4. Cường độ ánh sáng').position(20, 180).style('color', 'white');
    lightSlider = createSlider(0, 100, 50);
    lightSlider.position(20, 200);

    resetBtn = createButton('Reset Thí Nghiệm');
    resetBtn.position(20, 260);
    resetBtn.mousePressed(resetSim);

    seed = new BeanSeed();
}

function resetSim() {
    growthProgress = 0;
    stage = 'DRY';
    isFiltered = false;
    seed = new BeanSeed();
}

function draw() {
    // Background based on light
    let lightVal = lightSlider.value();
    let bgCol = map(lightVal, 0, 100, 40, 220);
    background(bgCol, bgCol, bgCol + 20);

    // Draw Simulation Area
    drawEnvironment();
    
    // Logic Update
    updateGrowth();
    
    // Draw Seed
    seed.display();
    
    // HUD
    drawHUD();
}

function drawEnvironment() {
    // Draw Petri Dish / Soil
    fill(100, 70, 40);
    if (waterToggle.checked()) fill(130, 100, 60); // Moist soil
    noStroke();
    ellipse(600, 450, 400, 150);
    
    fill(255, 255, 255, 100);
    ellipse(600, 450, 410, 160);
    
    fill(255);
    textAlign(CENTER);
    text("Khu vực mô phỏng (Đất/Bông thấm nước)", 600, 530);
}

function updateGrowth() {
    if (!isFiltered) return;

    let temp = tempSlider.value();
    let hasWater = waterToggle.checked();

    // State Transitions
    if (stage === 'DRY' && hasWater) {
        stage = 'SOAKED';
    }

    if (stage === 'SOAKED' && hasWater && temp >= OPTIMAL_TEMP_MIN && temp <= OPTIMAL_TEMP_MAX) {
        growthProgress += 0.2;
        if (growthProgress > 20) stage = 'ROOTING';
    }

    if (stage === 'ROOTING' && hasWater && temp >= OPTIMAL_TEMP_MIN && temp <= OPTIMAL_TEMP_MAX) {
        growthProgress += 0.1;
        if (growthProgress > 60) stage = 'SPROUTING';
    }

    if (stage === 'SPROUTING' && hasWater && temp >= OPTIMAL_TEMP_MIN && temp <= OPTIMAL_TEMP_MAX) {
        growthProgress += 0.05;
        if (growthProgress > 100) stage = 'GROWING';
    }

    // Growth penalty for extreme temps
    if (temp < CRITICAL_LOW || temp > CRITICAL_HIGH) {
        growthProgress -= 0.01; // Decay or stall
    }
}

function drawHUD() {
    fill(0, 0, 0, 150);
    rect(20, 320, 260, 250, 10);
    fill(255);
    textAlign(LEFT);
    textSize(16);
    text("BẢNG THEO DÕI KHOA HỌC", 40, 350);
    
    textSize(14);
    text(`Nhiệt độ: ${tempSlider.value()}°C`, 40, 380);
    text(`Độ ẩm: ${waterToggle.checked() ? "Đủ" : "Thiếu"}`, 40, 400);
    text(`Giai đoạn: ${translateStage(stage)}`, 40, 420);
    
    // Warnings
    fill(255, 100, 100);
    if (!isFiltered) text("⚠️ Cần lọc hạt lép/vỡ trước!", 40, 450);
    else if (!waterToggle.checked()) text("⚠️ Thiếu nước để kích hoạt", 40, 450);
    else if (tempSlider.value() < OPTIMAL_TEMP_MIN || tempSlider.value() > OPTIMAL_TEMP_MAX) {
        text("⚠️ Nhiệt độ không tối ưu (30-40°C)", 40, 450);
    }
    else {
        fill(100, 255, 100);
        text("✅ Điều kiện lý tưởng", 40, 450);
    }
    
    fill(255);
    textSize(12);
    text("Nguồn: [Text 1, 4, 5] - Sách KHTN", 40, 550);
}

function translateStage(s) {
    switch(s) {
        case 'DRY': return "Hạt khô";
        case 'SOAKED': return "Hạt ngâm nước (Sưng)";
        case 'ROOTING': return "Nảy mầm (Ra rễ)";
        case 'SPROUTING': return "Phát triển (Ra mầm)";
        case 'GROWING': return "Cây con";
        default: return "-";
    }
}

class BeanSeed {
    constructor() {
        this.x = 600;
        this.y = 440;
    }

    display() {
        push();
        translate(this.x, this.y);
        
        // Color based on light
        let lightVal = lightSlider.value();
        let plantColor = lightVal < 30 ? color(180, 200, 100) : color(34, 139, 34);
        
        // Root
        if (stage === 'ROOTING' || stage === 'SPROUTING' || stage === 'GROWING') {
            stroke(200, 200, 200);
            strokeWeight(3);
            let rootLen = map(growthProgress, 20, 60, 0, 30);
            line(0, 0, 0, rootLen);
        }

        // Stem
        if (stage === 'SPROUTING' || stage === 'GROWING') {
            stroke(plantColor);
            strokeWeight(5);
            let stemHeight = map(growthProgress, 60, 100, 0, 80);
            // Etiolation effect: grow taller but thinner/paler if light is low
            if (lightVal < 30) stemHeight *= 1.5;
            line(0, 0, 0, -stemHeight);
            
            // Leaves
            if (growthProgress > 80) {
                fill(plantColor);
                noStroke();
                ellipse(-10, -stemHeight, 20, 10);
                ellipse(10, -stemHeight, 20, 10);
            }
        }

        // Seed Body
        fill(180, 150, 100);
        let size = (stage === 'SOAKED' || stage === 'ROOTING' || stage === 'SPROUTING' || stage === 'GROWING') ? 30 : 25;
        ellipse(0, 0, size, size * 1.3);
        
        pop();
    }
}
</script>
</body>
</html>
