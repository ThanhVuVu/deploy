<!DOCTYPE html><html lang='vi'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Phản ứng làm mất màu nước bromine</title><script src='https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js'></script><style>body{margin:0;background:#eef3f7;font-family:Arial,sans-serif;color:#123}main{display:flex;justify-content:center}.p5Canvas{box-shadow:0 8px 28px rgba(0,0,0,.18);border-radius:14px;margin:12px}button{font-size:15px;margin:4px;padding:8px 12px;border-radius:8px;border:1px solid #396;background:#fff;cursor:pointer}button:hover{background:#e7f2ff}</style></head><body><main></main><script>let W=1180,H=760;let bromineFraction=1,ethyleneFlowOn=false,productUnits=0,timeSec=0,bubbles=[],bursts=[],spawnAcc=0;let btnToggle,btnReset;const SOURCES=[{id:'Text 1',page:109,claim:'Br2 cộng vào nối đôi C=C; phản ứng cộng; alkene làm mất màu nước bromine; trùng hợp tạo PE.'},{id:'Text 2',page:108,claim:'Ethylene C2H4, H2C=CH2, CH2=CH2; khí không màu, không mùi, nhẹ hơn không khí, ít tan trong nước.'},{id:'Text 3',page:108,claim:'Dụng cụ, hóa chất, 2 mL nước bromine; phương trình CH2=CH2 + Br2 -> BrCH2-CH2Br.'},{id:'Image 5',page:108,claim:'Ống nghiệm chứa 2 mL nước bromine màu nâu, ống dẫn khí ethylene.'},{id:'Text 4/Image 6',page:81,claim:'Ngoài chủ đề: 2Na + Cl2 -> 2NaCl; kim loại + oxygen tạo oxide; kim loại + phi kim tạo muối.'}];const FACTS={ethylene:{formula:'C2H4',structural:'H2C=CH2',condensed:'CH2=CH2',physical:['khí ở điều kiện thường','không màu','không mùi','nhẹ hơn không khí','ít tan trong nước'],source:'Text 2 p108'},experiment:{volumeML:2,equipment:['ống cao su dẫn khí','ống thủy tinh','ống nghiệm','kẹp ống nghiệm','giá thí nghiệm','ống hút nhỏ giọt'],chemicals:['khí ethylene','nước bromine'],source:'Text 3 p108, Image 5 p108'},reaction:{equation:'H2C=CH2 + Br2 → BrCH2-CH2Br',shortEquation:'CH2=CH2 + Br2 → BrCH2-CH2Br',type:'phản ứng cộng',mechanism:'Br2 cộng vào nối đôi C=C; liên kết kém bền trong liên kết đôi bị phá vỡ',observation:'nước bromine màu nâu mất màu khi dẫn ethylene vào',source:'Text 1 p109, Text 3 p108'},extension:{alkenes:'Tương tự ethylene, các alkene khác cũng làm mất màu nước bromine.',polymer:'nCH2=CH2 → (CH2-CH2)n; polyethylene PE có khối lượng rất lớn',unrelated:'2Na + Cl2 → 2NaCl; nhiều kim loại + oxygen tạo oxide; nhiều kim loại + phi kim tạo muối'}};const STANDARD={initialBr2Units:100,reactionRatePerSec:0.045,bubbleRate:7,geometryScale:'screen pixels only'};function setup(){let c=createCanvas(W,H);c.parent(document.querySelector('main'));textFont('Arial');btnToggle=createButton('Bật/Tắt dẫn khí ethylene');btnToggle.mousePressed(toggleFlow);btnReset=createButton('Làm lại thí nghiệm');btnReset.mousePressed(resetSim);resetSim()}function resetSim(){bromineFraction=1;ethyleneFlowOn=false;productUnits=0;timeSec=0;bubbles=[];bursts=[];spawnAcc=0}function toggleFlow(){ethyleneFlowOn=!ethyleneFlowOn}function keyPressed(){if(key===' '){toggleFlow();return false}if(key==='r'||key==='R'){resetSim();return false}}function mousePressed(){if(dist(mouseX,mouseY,105,425)<30)toggleFlow()}function draw(){background(235,243,249);updateModel();drawTitle();drawApparatus();drawMoleculeAnimation();drawHUD();drawSourcePanel()}function updateModel(){let dt=min(deltaTime/1000,0.05);if(ethyleneFlowOn&&bromineFraction>0){timeSec+=dt;let consumed=min(bromineFraction,STANDARD.reactionRatePerSec*dt);bromineFraction-=consumed;productUnits+=consumed*STANDARD.initialBr2Units;spawnAcc+=dt*STANDARD.bubbleRate;while(spawnAcc>1){spawnAcc--;spawnBubble()}if(frameCount%12===0)bursts.push({x:random(215,285),y:random(390,545),life:1})}for(let b of bubbles){b.y-=b.vy*dt;b.x+=sin(frameCount*.08+b.phase)*0.35;if(b.y<360)b.air=true;b.life-=dt*.18}bubbles=bubbles.filter(b=>b.y>130&&b.life>0);for(let q of bursts)q.life-=dt*1.5;bursts=bursts.filter(q=>q.life>0)}function spawnBubble(){bubbles.push({x:250+random(-8,8),y:545+random(-4,4),r:random(4,9),vy:random(35,62),phase:random(TWO_PI),life:1,air:false})}function drawTitle(){fill(20,55,80);noStroke();textSize(25);textStyle(BOLD);text('Phản ứng làm mất màu nước bromine bởi khí ethylene',24,34);textStyle(NORMAL);textSize(14);fill(70);text('Tương tác: nhấn SPACE hoặc bấm van để dẫn/dừng khí; R để làm lại.',26,58)}function drawApparatus(){let tx=180,ty=142,tw=150,th=430,liquidH=190,liquidTop=ty+th-liquidH;stroke(80);strokeWeight(10);line(95,132,95,620);line(55,620,370,620);strokeWeight(6);line(95,220,180,220);line(95,460,180,460);noStroke();fill(80);textSize(13);text('giá thí nghiệm + kẹp ống nghiệm',35,648);stroke(125,145,155);strokeWeight(18);noFill();line(60,425,250,425);line(250,425,250,548);stroke(220);strokeWeight(8);line(60,425,250,425);line(250,425,250,548);noStroke();fill(255);stroke(120);strokeWeight(2);rect(24,306,72,102,18);noStroke();fill(30,80,120);textSize(14);textAlign(CENTER);text('Bình khí\nethylene\nC₂H₄',60,333);textAlign(LEFT);fill(40);text('ống cao su + ống thủy tinh',130,405);fill(ethyleneFlowOn?color(20,150,70):color(205,60,45));stroke(60);strokeWeight(2);circle(105,425,42);noStroke();fill(255);textAlign(CENTER);textSize(12);text(ethyleneFlowOn?'MỞ':'ĐÓNG',105,429);textAlign(LEFT);let brown=color(142,72,20,215);let clear=color(220,245,255,45);let liq=lerpColor(clear,brown,bromineFraction);noStroke();fill(liq);rect(tx+10,liquidTop,tw-20,liquidH,0,0,28,28);stroke(70,90,100,145);strokeWeight(3);noFill();rect(tx,ty,tw,th,0,0,34,34);stroke(210,235,250,160);strokeWeight(2);line(tx+18,ty+15,tx+18,ty+th-25);noStroke();fill(70);textSize(14);text('Ống nghiệm chứa khoảng 2 mL nước bromine',tx-35,ty-14);fill(50);text('Màu hiện tại: '+(bromineFraction>0.12?'nâu đang nhạt dần':'gần như không màu'),tx-20,ty+th+26);fill(80);text('Br₂ còn lại: '+nf(bromineFraction*100,2,1)+'%',tx-20,ty+th+46);for(let b of bubbles){stroke(70,150,220,170);strokeWeight(1.4);fill(255,255,255,b.air?35:70);circle(b.x,b.y,b.r*2);if(b.air){noStroke();fill(45,100,145,140);textSize(10);text('↑ nhẹ hơn không khí',b.x+8,b.y)}}for(let q of bursts){noStroke();fill(255,230,60,180*q.life);circle(q.x,q.y,34*q.life);fill(120,50,10,220*q.life);textSize(11);text('Br₂ + C=C',q.x+14,q.y)}noStroke();fill(40,90,130);textSize(13);text('Bọt khí ethylene: không màu, không mùi, ít tan trong nước',344,468);drawEthylene(410,515,0.72)}function drawMoleculeAnimation(){let x=365,y=92;fill(255);stroke(190);strokeWeight(1.5);rect(x-20,y-30,245,210,14);noStroke();fill(20,55,85);textSize(15);textStyle(BOLD);text('Mô hình phản ứng cộng',x,y-8);textStyle(NORMAL);drawEthylene(x+42,y+56,0.7);drawBr2(x+136,y+56,0.7);fill(30);textSize(24);text('+',x+91,y+62);text('→',x+171,y+62);drawProduct(x+105,y+137,0.68);stroke(220,70,50);strokeWeight(2);if(ethyleneFlowOn&&bromineFraction>0){line(x+24,y+76,x+62,y+36);line(x+62,y+36,x+100,y+76);noStroke();fill(220,60,40);textSize(12);text('liên kết kém bền trong C=C bị phá vỡ',x+8,y+102)}noStroke();fill(50);textSize(12);text('CH₂=CH₂ + Br₂ → BrCH₂-CH₂Br',x+8,y+180)}function drawEthylene(x,y,s){push();translate(x,y);scale(s);stroke(30);strokeWeight(2);line(-20,-3,20,-3);line(-20,5,20,5);noStroke();fill(40,40,40);textAlign(CENTER,CENTER);textSize(20);text('C',-27,0);text('C',27,0);textSize(15);fill(20,90,150);text('H₂',-55,-15);text('H₂',55,-15);fill(30);text('H₂C=CH₂',0,32);pop();textAlign(LEFT,BASELINE)}function drawBr2(x,y,s){push();translate(x,y);scale(s);stroke(130,55,20);strokeWeight(2);line(-16,0,16,0);noStroke();fill(190,95,35);circle(-28,0,32);circle(28,0,32);fill(255);textAlign(CENTER,CENTER);textSize(14);text('Br',-28,0);text('Br',28,0);fill(30);textSize(15);text('Br₂',0,32);pop();textAlign(LEFT,BASELINE)}function drawProduct(x,y,s){push();translate(x,y);scale(s);stroke(30);strokeWeight(2);line(-28,0,28,0);line(-52,0,-30,0);line(30,0,52,0);noStroke();fill(40);textAlign(CENTER,CENTER);textSize(18);text('CH₂',-28,0);text('CH₂',28,0);fill(190,95,35);circle(-68,0,30);circle(68,0,30);fill(255);textSize(13);text('Br',-68,0);text('Br',68,0);fill(30);textSize(14);text('BrCH₂-CH₂Br',0,34);pop();textAlign(LEFT,BASELINE)}function drawHUD(){let x=640,y=78,w=510,h=356;fill(255,252,244);stroke(200,185,145);strokeWeight(1.5);rect(x,y,w,h,14);noStroke();fill(45,55,75);textSize(17);textStyle(BOLD);text('Bảng quan sát và dữ kiện',x+16,y+27);textStyle(NORMAL);textSize(14);let lines=['Ethylene: công thức phân tử C₂H₄; cấu tạo H₂C=CH₂; thu gọn CH₂=CH₂.','Trong ethylene có liên kết đôi C=C; một liên kết trong liên kết đôi kém bền.','Tính chất vật lí: khí không màu, không mùi, nhẹ hơn không khí, ít tan trong nước.','Dụng cụ: ống cao su, ống thủy tinh, ống nghiệm, kẹp, giá thí nghiệm, ống hút nhỏ giọt.','Hóa chất: khí ethylene và nước bromine.','Phương trình: H₂C=CH₂ + Br₂ → BrCH₂-CH₂Br.','Bản chất: Br₂ cộng hợp vào nối đôi C=C; đây là phản ứng cộng.'];let yy=y+55;for(let ln of lines){fill(35);text('• '+ln,x+18,yy,w-34,34);yy+=38}fill(245);stroke(210);rect(x+16,y+h-58,w-32,42,8);noStroke();fill(90,55,20);textSize(14);text('Kết quả mô phỏng: sản phẩm BrCH₂-CH₂Br tích lũy ≈ '+nf(productUnits,2,1)+' / '+STANDARD.initialBr2Units+' đơn vị Br₂ chuẩn hóa.',x+28,y+h-32)}function drawSourcePanel(){let x=640,y=452,w=510,h=282;fill(248,252,255);stroke(180,205,220);rect(x,y,w,h,14);noStroke();fill(30,60,80);textSize(16);textStyle(BOLD);text('Bản đồ nguồn RAG + mở rộng',x+16,y+25);textStyle(NORMAL);textSize(12.2);fill(40);text('[Text 1 p109] Br₂ cộng vào C=C; phản ứng cộng; alkene khác cũng làm mất màu nước bromine.',x+16,y+51,w-26,28);text('[Text 2 p108] C₂H₄, H₂C=CH₂, CH₂=CH₂; khí không màu, không mùi, nhẹ hơn không khí, ít tan.',x+16,y+84,w-26,28);text('[Text 3 p108 + Image 5] Khoảng 2 mL nước bromine màu nâu; dẫn ethylene qua ống thủy tinh vào ống nghiệm.',x+16,y+118,w-26,28);fill(20,80,120);text('Mở rộng polymer hóa: nCH₂=CH₂ → (CH₂-CH₂)n; sản phẩm polyethylene PE có khối lượng rất lớn.',x+16,y+155,w-26,32);fill(100,70,55);text('Nguồn ngoài chủ đề vẫn được hiển thị: 2Na + Cl₂ → 2NaCl; kim loại + O₂ tạo oxide; kim loại + phi kim tạo muối.',x+16,y+192,w-26,34);fill(130,30,30);text('[Standard Simulation Values] Br₂ ban đầu = 100 đơn vị, tốc độ mất màu = 0.045 phần/giây, bọt khí = 7 bọt/giây; các kích thước là quy ước màn hình.',x+16,y+232,w-26,38);fill(30,90,50);textSize(13);text(ethyleneFlowOn?'Trạng thái: ĐANG dẫn khí ethylene vào nước bromine.':'Trạng thái: đã dừng dẫn khí ethylene.',x+16,y+270)}</script></body></html>
